name: Deploy Waybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          VITE_WAYBOOK_APPS_SCRIPT_URL: ${{ vars.WAYBOOK_APPS_SCRIPT_URL }}
          VITE_WAYBOOK_GOOGLE_CLIENT_ID: ${{ vars.WAYBOOK_GOOGLE_CLIENT_ID }}
          VITE_WAYBOOK_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VITE_WAYBOOK_BUILD_ID: ${{ github.sha }}
        run: |
          export VITE_BASE_PATH="/${{ github.event.repository.name }}/"
          bun run build
          printf '{"build":"%s"}\n' "$VITE_WAYBOOK_BUILD_ID" > dist/waybook-version.json
      - uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to become visible
        run: sleep 30
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-deploy:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    uses: ./.github/workflows/waybook-push.yml
    with:
      kind: app
    secrets:
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      WAYBOOK_PUSH_BRIDGE_SECRET: ${{ secrets.WAYBOOK_PUSH_BRIDGE_SECRET }}
